// ── Connection indicator ───────────────────────────────────────────────────
function setConn(state,text){
  const el=$('#conn-status'); if(!el) return;
  el.className = state;
  el.textContent = text;
}

// ── Cloud I/O ──────────────────────────────────────────────────────────────
async function cloudLoad(){
  const { data, error } = await sb.from('club_state').select('data').eq('id',1).maybeSingle();
  if(error){ console.error('[cloudLoad]', error); return null; }
  if(!data || !data.data || Object.keys(data.data).length === 0) return null;
  return data.data;
}

let saveTimer=null, savePending=false;
function save(){
  if(!adm) return;
  savePending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}

async function flushSave(){
  if(!adm || !dbReady) { savePending = false; return; }
  savePending = false;
  setConn('saving','saving…');
  try{
    const { error } = await sb.from('club_state').upsert({
      id: 1,
      data: S,
      updated_at: new Date().toISOString()
    });
    if(error) throw error;
    setConn('online','cloud ✓');
    const sv=$('#sv'); if(sv) sv.textContent = 'Saved '+new Date().toLocaleTimeString();
  }catch(e){
    const msg = (e && (e.message || e.details || e.hint)) || JSON.stringify(e) || 'unknown';
    console.error('[flushSave] full error:', e);
    setConn('error','save failed');
    toast('Cloud save failed: ' + msg);
  }
}

let rtChannel=null;
function subscribeRealtime(){
  if(rtChannel) return;
  rtChannel = sb.channel('club_state_changes')
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'club_state', filter: 'id=eq.1' },
        payload => {
          if(!payload.new || !payload.new.data) return;
          if(savePending) return;
          S = Object.assign(def(), payload.new.data);
          initOpp();
          hd();
          if(!M || M.over){ go(cur); }
          setConn('online','cloud ✓ synced');
        })
    .subscribe(status => {
      if(status==='SUBSCRIBED') setConn('online','cloud ✓');
    });
}

// ── Auth ───────────────────────────────────────────────────────────────────
function showLogin(){
  const lc=document.getElementById('login-crest'); if(lc) lc.innerHTML=crest(48);
  const ls=document.getElementById('login-screen'); if(ls) ls.style.display='flex';
  const err=document.getElementById('login-err'); if(err) err.textContent='';
  setTimeout(()=>{const p=document.getElementById('login-pw'); if(p) p.focus()},50);
}
function hideLogin(){
  const ls=document.getElementById('login-screen'); if(ls) ls.style.display='none';
}

async function doLogin(){
  const field=document.getElementById('login-pw');
  const err=document.getElementById('login-err');
  const btn=document.getElementById('login-btn');
  if(!field||!err||!btn) return;
  const pw=field.value;
  err.textContent='';
  if(!pw){ err.textContent='Please enter the password.'; field.focus(); return; }

  btn.disabled=true; btn.textContent='Signing in…';
  try{
    const { error } = await sb.auth.signInWithPassword({
      email: ADMIN_EMAIL,
      password: pw
    });
    if(error){
      err.textContent = (error.message||'').includes('Invalid') ? 'Wrong password.' : error.message;
      field.value=''; field.focus(); return;
    }
    const cloud = await cloudLoad();
    if(cloud){
      S = Object.assign(def(), cloud);
      initOpp();
      dbReady = true;
    } else {
      S = Object.assign(def(), JSON.parse(document.getElementById('seed').textContent||'{}'));
      initOpp();
      if(!S.fx || !S.fx.length) gen();
      dbReady = true;
      await flushSave();
    }
    adm=true; RO=false;
    document.body.classList.remove('ro');
    hideLogin();
    subscribeRealtime();
    ctl(); hd(); go(cur);
    toast('Welcome back, Manager. Cloud sync active.');
  }catch(e){
    console.error('[doLogin]', e);
    err.textContent = 'Login failed: ' + ((e && e.message) || 'network error');
  }finally{
    btn.disabled=false; btn.textContent='Sign In';
  }
}

function finv(){return`<h2>FINANCES</h2><div class="g"><div class="card"><div class="mu">Balance</div><div class="big">${fm(S.bal)}</div></div>${['Matchday revenue (general)','VIP revenue','Sponsorship'].map(k=>`<div class="card"><div class="mu">${k}</div><div class="big">${fm(S.fin.filter(f=>f.t==k).reduce((a,f)=>a+f.a,0))}</div></div>`).join('')}<div class="card"><div class="mu">Expenses (all)</div><div class="big">${fm(-S.fin.filter(f=>f.a<0).reduce((a,f)=>a+f.a,0))}</div></div></div><div class="card tw" style="margin-top:12px"><h3>History</h3><table><tr><th>Item</th><th>Amount</th><th>Balance</th></tr>${S.fin.map(f=>`<tr><td>${f.t}</td><td style="color:${f.a<0?'#ff6b6b':'#4cff7a'}">${fm(f.a)}</td><td>${fm(f.b)}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">No transactions yet.</td></tr>'}</table></div>`}
function tro(){return`<h2>TROPHY ROOM</h2><div class="g">${S.tro.map(t=>`<div class="card" style="text-align:center"><div style="font-size:44px">🏆</div><b>${t.t}</b><div class="mu">Season ${t.s}</div></div>`).join('')||'<div class="card mu">Cabinet empty — win the league or cup!</div>'}</div>`}
function newsv(){return`<h2>CLUB NEWS</h2><div class="card">${S.news.map(n=>`<div>${n.d} — ${n.t}</div>`).join('')||'<span class="mu">No news.</span>'}</div>`}
function dressing(){
  if(!S.relationships)S.relationships={};if(!S.talks)S.talks=[];if(typeof S.atmo!=='number')S.atmo=70;
  const players=S.players;const sel=S.selectedPlayer?P(S.selectedPlayer):null;
  const mgrAvatar=`<svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#d4af37" stroke="#fff" stroke-width="2"/><circle cx="40" cy="32" r="14" fill="#e8b98a"/><path d="M26 30 Q40 14 54 30 Q54 22 40 20 Q26 22 26 30Z" fill="#3a2a1a"/><circle cx="34" cy="30" r="2" fill="#000"/><circle cx="46" cy="30" r="2" fill="#000"/><path d="M34 38 Q40 42 46 38" stroke="#8a5a3a" stroke-width="2" fill="none"/><path d="M24 80 Q24 58 40 54 Q56 58 56 80Z" fill="#c8102e"/><path d="M34 56 L40 62 L46 56" stroke="#d4af37" stroke-width="2" fill="none"/></svg>`;
  const moodEmoji=m=>m>=70?'😊':m>=45?'😐':'😟';const moodColor=m=>m>=70?'#2f9e4a':m>=45?'#d4af37':'#c8102e';
  const atmoLabel=S.atmo>=80?'Excellent':S.atmo>=60?'Good':S.atmo>=40?'Average':S.atmo>=20?'Poor':'Awful';const atmoColor=S.atmo>=70?'#2f9e4a':S.atmo>=45?'#d4af37':'#c8102e';
  const playerCards=players.map(p=>{const isSel=S.selectedPlayer==p.id;return`<div class="dr-player ${isSel?'selected':''}" onclick="selectPlayer(${p.id})"><div class="avatar" style="background:${moodColor(p.mor)}22;color:${moodColor(p.mor)};border-color:${moodColor(p.mor)}">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}<span class="mood-dot" style="background:${moodColor(p.mor)}"></span></div><div class="name">${p.name}${S.cap==p.id?' ©':''}</div><div class="pos">${p.pos} · #${p.num}</div><div class="morale-bar"><i style="width:${p.mor}%;background:${moodColor(p.mor)}"></i></div><div class="mu" style="font-size:10px;margin-top:3px">${moodEmoji(p.mor)} ${p.mor}%</div></div>`}).join('')||'<div class="mu">No players yet — generate a squad in the Squad page.</div>';
  let dialogue='';if(sel){const rel=S.relationships[sel.id]||5;dialogue=`<div class="dr-dialogue"><div class="speaker">${sel.name} · ${sel.pos} · OVR ${sel.ovr}</div><div class="text" id="dr-text">${playerGreeting(sel)}</div><div class="mu" style="margin-top:6px">Morale: ${sel.mor}% · Fitness: ${sel.fit}% · Relationship with you: ${rel}/10</div><div class="dr-actions"><button onclick="teamTalk(${sel.id},'praise')">👏 Praise</button><button onclick="teamTalk(${sel.id},'encourage')">💪 Encourage</button><button onclick="teamTalk(${sel.id},'criticize')">🔴 Criticize</button><button class="s" onclick="teamTalk(${sel.id},'rest')">😴 Rest</button></div></div>`}else{dialogue=`<div class="dr-dialogue"><div class="speaker">Manager's Office</div><div class="text">Select a player from the dressing room to interact with them. Your words affect their morale, your relationship, and the overall team atmosphere.</div></div>`}
  const talkLog=(S.talks||[]).slice(0,10).map(t=>`<div><span class="t">${t.time}</span> — ${t.text}</div>`).join('')||'<div class="mu">No team talks yet.</div>';
  const relList=players.slice(0,8).map(p=>{const r=S.relationships[p.id]||5;const col=r>=7?'#2f9e4a':r>=4?'#d4af37':'#c8102e';return`<div class="rel-row"><div class="rel-av" style="background:${col}22;color:${col}">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div style="flex:1;font-size:12px">${p.name}</div><div class="rel-bar"><i style="width:${r*10}%;background:${col}"></i></div><div style="font-size:11px;color:var(--m);width:28px;text-align:right">${r}/10</div></div>`}).join('')||'<div class="mu">No players.</div>';
  const globalActions=`<div class="dr-actions"><button onclick="globalTalk('hype')">🔥 Fire Up Team</button><button onclick="globalTalk('calm')">🧘 Calm Nerves</button><button onclick="globalTalk('tactical')">📋 Tactical Focus</button><button class="s" onclick="globalTalk('praise')">👏 Praise All</button></div>`;
  return`<h2>DRESSING ROOM</h2><div class="card" style="margin-bottom:12px"><div class="manager-scene"><div>${mgrAvatar}</div><div style="flex:1;min-width:200px"><div class="big" style="font-size:20px">${S.mgr}</div><div class="mu">Manager · PHOENIX FC</div><div style="margin-top:8px"><div class="mu">Team Atmosphere: <b style="color:${atmoColor}">${atmoLabel}</b> (${S.atmo}%)</div><div class="atmo-bar"><i style="width:${S.atmo}%"></i></div></div></div><div style="text-align:center"><div style="font-size:40px">🚪</div><div class="mu">${players.length} players</div></div></div></div><div class="g"><div class="card"><h3>🗣 Manager's Talk</h3><div class="mu" style="margin-bottom:8px">Speak to the whole squad. Your words shift team morale and atmosphere.</div>${globalActions}</div><div class="card"><h3>📊 Atmosphere</h3><div style="font-size:32px;text-align:center;margin:8px 0">${S.atmo>=70?'🔥':S.atmo>=45?'👍':'⚠️'}</div><div class="mu" style="text-align:center">Team atmosphere is ${atmoLabel.toLowerCase()}.</div><div class="atmo-bar" style="margin-top:10px"><i style="width:${S.atmo}%"></i></div><div class="mu" style="margin-top:8px;text-align:center">Recent talks</div><div class="talk-log">${talkLog}</div></div></div><div class="card" style="margin-top:12px"><h3>👥 The Squad</h3><div class="mu" style="margin-bottom:10px">Click a player to speak with them individually.</div><div class="dr-grid">${playerCards}</div></div>${dialogue}<div class="card" style="margin-top:12px"><h3>🤝 Player Relationships</h3><div class="mu" style="margin-bottom:6px">How each player feels about you as manager.</div>${relList}</div>`}
function playerGreeting(p){const lines=[`${p.name} nods at you. "Boss, ready to work."`,`${p.name} looks up from lacing their boots. "What's the plan, gaffer?"`,`${p.name} smiles. "Feeling good today, boss."`,`${p.name} leans against their locker. "Anything you need?"`,`${p.name} glances at the tactics board. "I'm listening, boss."`];if(p.mor<40)return`${p.name} avoids eye contact. "I'm not happy, boss. I need to talk."`;if(p.mor>80)return`${p.name} grins broadly. "Buzzing for the next match, gaffer!"`;return ch(lines)}
function selectPlayer(id){S.selectedPlayer=id;save();go('dressing')}
function teamTalk(id,type){if(!requireLogin())return;const p=P(id);if(!p)return;if(!S.relationships)S.relationships={};if(!S.talks)S.talks=[];let rel=S.relationships[id]||5;let msg='',dMor=0,dAtmo=0;switch(type){case'praise':msg=`You praised ${p.name}.`;dMor=8;dAtmo=2;if(rel<8)rel++;break;case'encourage':msg=`You encouraged ${p.name} to keep pushing.`;dMor=5;dAtmo=1;break;case'criticize':msg=`You criticized ${p.name}'s recent performances.`;dMor=-6;dAtmo=-2;if(rel>2)rel--;break;case'rest':msg=`You gave ${p.name} extra rest to recover.`;p.fit=Math.min(100,p.fit+5);dMor=2;dAtmo=0;break}p.mor=Math.max(10,Math.min(100,p.mor+dMor));S.atmo=Math.max(0,Math.min(100,S.atmo+dAtmo));S.relationships[id]=Math.max(0,Math.min(10,rel));S.talks.unshift({time:new Date().toLocaleTimeString(),text:msg});S.talks=S.talks.slice(0,50);save();go('dressing');toast(msg)}
function globalTalk(type){if(!requireLogin())return;if(!S.players.length)return;if(!S.talks)S.talks=[];let msg='',dMor=0,dAtmo=0;switch(type){case'hype':msg='You fired up the team before training.';dMor=6;dAtmo=8;break;case'calm':msg='You calmed the squad and focused their minds.';dMor=3;dAtmo=5;break;case'tactical':msg='You gave a tactical briefing to the whole squad.';dMor=2;dAtmo=4;break;case'praise':msg='You praised the entire squad for their effort.';dMor=7;dAtmo=6;break}S.players.forEach(p=>{p.mor=Math.max(10,Math.min(100,p.mor+dMor))});S.atmo=Math.max(0,Math.min(100,S.atmo+dAtmo));S.talks.unshift({time:new Date().toLocaleTimeString(),text:msg});S.talks=S.talks.slice(0,50);save();go('dressing');toast(msg)}
function kit(){const k=S.kit[ks],m=S.mas,nm={h:'home',a:'away',t:'third',g:'goalkeeper'};return`<h2>KIT &amp; MASCOT</h2><div class="g"><div class="card"><h3>Club kits</h3><div style="display:flex;gap:8px;flex-wrap:wrap;text-align:center">${['h','a','t','g'].map(x=>`<div onclick="ks='${x}';go('kit')" style="cursor:pointer;padding:6px;border-radius:10px;border:2px solid ${ks==x?'var(--g)':'transparent'}">${kitSVG(S.kit[x],90,'10')}<div class="mu">${nm[x]}</div></div>`).join('')}</div><div class="mu" style="margin-top:8px">Matches use the home kit at home and the away kit away.</div></div><div class="card"><h3>Edit ${nm[ks]} kit</h3>${['Shirt','Shorts','Trim','Socks'].map((l,i)=>`<div>${l} <input type="color" value="${k.c[i]}" onchange="if(!requireLogin())return;S.kit['${ks}'].c[${i}]=this.value;save();go('kit')"></div>`).join('')}<div>Pattern <select onchange="if(!requireLogin())return;S.kit['${ks}'].p=this.value;save();go('kit')">${['solid','stripes','hoops','half'].map(x=>`<option ${x==k.p?'selected':''}>${x}</option>`).join('')}</select></div><div>Tactics-board kit <select onchange="if(!requireLogin())return;S.kitSel=this.value;save();applyKit()">${['h','a','t'].map(x=>`<option value="${x}" ${S.kitSel==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="mu">The crest uses the home shirt and trim colours.</div></div><div class="card" style="text-align:center"><h3>Mascot: ${m.name}</h3>${mas()}<div><button class="keep" onclick="if(!requireLogin())return;mood('happy')">Celebrate</button><button class="s keep" onclick="if(!requireLogin())return;mood('sad')">Sad</button></div></div><div class="card"><h3>Edit mascot</h3><div>Name <input value="${m.name}" style="width:140px" onchange="if(!requireLogin())return;S.mas.name=this.value;save();go('kit')"></div>${[['Body','c1'],['Core','c2'],['Wings','c3']].map(r=>`<div>${r[0]} <input type="color" value="${m[r[1]]}" onchange="if(!requireLogin())return;S.mas['${r[1]}']=this.value;save();go('kit')"></div>`).join('')}<label><input type="checkbox" ${m.kit?'checked':''} onchange="if(!requireLogin())return;S.mas.kit=this.checked;save();go('kit')"> Wears home shirt</label></div></div>`}
const I=(v,f,w=110,n)=>`<input ${n?'type="number"':''} value="${String(v==null?'':v).replace(/"/g,'&quot;')}" style="width:${w}px" onchange="${f}">`;
const U=(c,i,k,n)=>`upd('${c}',${i},'${k}',this.value,${n?1:0})`;
const SEL=(a,v,f)=>`<select onchange="${f}">${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
const OPTS=t=>t.map((x,j)=>`<option value="${j}">${x.n}</option>`).join('');
function upd(c,i,k,v,n){if(!requireLogin())return;S[c][i][k]=n?+v:v;save();toast('Saved ✓')}
function renT(i,v){if(!requireLogin())return;v=v.trim();if(!v||OPP.some((o,j)=>j!=i&&o[0]==v))return alert('Team names must be unique');const old=OPP[i][0];OPP[i][0]=v;S.tab[v]=S.tab[old];delete S.tab[old];S.fx.forEach(f=>{if(f.opp==old)f.opp=v});syncT();save();toast('Team renamed ✓')}
function addT(){if(!requireLogin())return;if(OPP.length>=19)return alert('This league already has 20 clubs including PHOENIX FC.');const n=$('#tnm').value.trim();if(!n||OPP.some(o=>o[0]==n))return alert('Enter a unique team name');if(!confirm('Adding a team rebuilds the fixtures and league table. Continue?'))return;OPP.push([n,+$('#tst').value||65]);syncT();gen();save();go('admin')}
function delT(i){return alert('The league is fixed at 20 clubs. Rename this team if you want a different club.')}
function addDef(){if(!requireLogin())return;if(!confirm('Fill the league to 20 teams? Fixtures and table will be rebuilt.'))return;DEFT.forEach(t=>{if(OPP.length<19&&!OPP.some(o=>o[0]==t[0]))OPP.push([t[0],t[1]])});syncT();gen();save();go('admin')}
function mkCust(){if(!requireLogin())return;const n=$('#cn').value.trim(),t=$('#ct').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||t.length<2)return alert('Name and at least 2 teams needed');S.cust.push({name:n,teams:t.map(x=>({n:x,p:0,w:0,d:0,l:0,gf:0,ga:0}))});save();go('admin')}
function addR(ci){if(!requireLogin())return;const c=S.cust[ci],h=c.teams[+$('#rh'+ci).value],a=c.teams[+$('#ra'+ci).value];const x=+$('#rx'+ci).value||0,y=+$('#ry'+ci).value||0;if(h==a)return alert('Pick two different teams');h.p++;a.p++;h.gf+=x;h.ga+=y;a.gf+=y;a.ga+=x;if(x>y){h.w++;a.l++}else if(x<y){a.w++;h.l++}else{h.d++;a.d++}save();go('admin')}
function addBlank(){if(!requireLogin())return;let n=1;while(S.players.some(p=>p.num==n))n++;S.players.push({id:S.nid++,name:'New Player',num:n,nat:'-',age:20,pos:'MID',ovr:60,fit:100,mor:70,form:6,xp:0,apps:0,goals:0,inj:0});save();go('admin')}
function addTx(){if(!requireLogin())return;const a=+$('#ta').value;if(!a)return;fin($('#tl').value||'Manual adjustment',a);save();go('admin')}
async function chPw(){if(!requireLogin())return;const v=$('#npw').value;if(v.length<6)return alert('Use at least 6 characters');const {error}=await sb.auth.updateUser({password:v});if(error)return alert('Could not update password: '+error.message);const e=$('#npw');if(e)e.value='';alert('Password updated successfully. Use it next time you log in.')}
function renderSeasonHistory(){const history=Array.isArray(S.seasonHistory)?S.seasonHistory:[];if(!history.length)return'<div class="card" style="margin-top:12px"><h3>Season History</h3><div class="mu">No previous seasons saved yet.</div></div>';return'<div class="card" style="margin-top:12px"><h3>Season History</h3>'+history.slice().reverse().map(h=>{const rows=Object.entries(h.table||{}).map(([k,v])=>({name:k==='ME'?S.club:k,p:v.p||0,w:v.w||0,d:v.d||0,l:v.l||0,gf:v.gf||0,ga:v.ga||0,pts:(v.w||0)*3+(v.d||0)})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));const position=rows.findIndex(r=>r.name===S.club)+1;const played=(h.fixtures||[]).filter(f=>f.done).length;return'<details style="margin:10px 0;padding:10px;background:#101014;border:1px solid #333;border-radius:8px"><summary><b>Season '+h.season+'</b> · '+played+'/38 matches · '+(position?('Finished '+position+(position===1?'st':position===2?'nd':position===3?'rd':'th')):'Position unavailable')+'</summary><div class="tw"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+(r.gf-r.ga)+'</td><td>'+r.pts+'</td></tr>').join('')+'</table></div></details>'}).join('')+'</div>'}
const AD={
  ov:()=>`<div class="g">${[['Teams in league',OPP.length+1],['Players',S.players.length],['Balance',fm(S.bal)],['Matches played',S.fx.filter(f=>f.done).length+' / '+S.fx.length]].map(x=>`<div class="card"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><div style="margin-top:10px"><button onclick="go('match')">▶ Play match</button><button onclick="auto()">Auto-pick XI</button><button class="s" onclick="exportD()">Backup</button></div>`,
  club:()=>[['Club name',S.club,'S.club'],['Manager',S.mgr,'S.mgr'],['Objective',S.obj,'S.obj'],['Season',S.season,'S.season',1],['Popularity 0-100',S.pop,'S.pop',1]].map(r=>`<div>${r[0]} ${I(r[1],`${r[2]}=${r[3]?'+':''}this.value;save();hd()`,220,r[3])}</div>`).join('')+'<div class="mu">Crest and kits: see Kit &amp; Mascot.</div>',
  pl:()=>`<button onclick="addBlank()">+ Add player</button><div class="tw"><table><tr><th>Name</th><th>#</th><th>Pos</th><th>OVR</th><th>Age</th><th>Fit</th><th>Mor</th><th>Inj</th><th></th></tr>${S.players.map((p,i)=>`<tr><td>${I(p.name,U('players',i,'name'),120)}</td><td>${I(p.num,U('players',i,'num',1),50,1)}</td><td>${SEL(['GK','DEF','MID','FWD'],p.pos,U('players',i,'pos'))}</td>${['ovr','age','fit','mor','inj'].map(k=>`<td>${I(p[k],U('players',i,k,1),52,1)}</td>`).join('')}<td><button onclick="rem(${p.id})">✕</button></td></tr>`).join('')||'<tr><td colspan=9 class="mu">No players.</td></tr>'}</table></div>`,
  tm:()=>`<div class="tw"><table><tr><th>Team</th><th>Strength (40-90)</th><th></th></tr>${OPP.map((o,i)=>`<tr><td>${I(o[0],`renT(${i},this.value)`,170)}</td><td>${I(o[1],`OPP[${i}][1]=+this.value;syncT();save();toast('Saved ✓')`,60,1)}</td><td><button onclick="delT(${i})">✕</button></td></tr>`).join('')}</table></div><div style="margin-top:8px"><input id="tnm" placeholder="New team name"><input id="tst" type="number" value="65" style="width:70px"><button onclick="addT()">Add team</button><button class="s" onclick="addDef()">Fill to 20 teams</button></div>`,
  st:()=>Object.keys(S.staff).map(k=>`<div>${k} ${I(S.staff[k],`S.staff['${k}']=this.value;save()`,220)}</div>`).join(''),
  fi:()=>`<div>Balance ${I(S.bal,'S.bal=+this.value;save()',140,1)}</div><div style="margin:8px 0"><input id="tl" placeholder="Label"> <input id="ta" type="number" placeholder="Amount (negative = expense)"> <button onclick="addTx()">Add transaction</button><button class="s" onclick="if(!requireLogin())return;S.fin=[];save();go('admin')">Clear history</button></div>`+S.fin.slice(0,8).map(f=>`<div class="mu">${f.t}: ${fm(f.a)}</div>`).join(''),
  sd:()=>[['Capacity','cap'],['VIP capacity','vip'],['Attendance','att'],['VIP attendance','va']].map(r=>`<div>${r[0]} ${I(S.stad[r[1]],`S.stad.${r[1]}=+this.value;save()`,120,1)}</div>`).join('')+`<div>Lighting ${SEL(['auto','day','night'],S.night===null?'auto':S.night?'night':'day',`S.night=this.value=='auto'?null:this.value=='night';tick();save()`)}</div>`,
  fx:()=>`<div class="tw"><table><tr><th>Date</th><th>KO</th><th>Opponent</th><th>H/A</th><th>Comp</th><th>Score</th><th>Done</th><th></th></tr>${S.fx.map((f,i)=>`<tr><td>${I(f.date,U('fx',i,'date'),120)}</td><td>${I(f.ko,U('fx',i,'ko'),60)}</td><td>${SEL(OPP.map(o=>o[0]),f.opp,U('fx',i,'opp'))}</td><td>${SEL(['Home','Away'],f.home?'Home':'Away',`S.fx[${i}].home=this.value=='Home';save()`)}</td><td>${I(f.comp,U('fx',i,'comp'),70)}</td><td>${I(f.score||'',U('fx',i,'score'),150)}</td><td>${SEL(['No','Yes'],f.done?'Yes':'No',`S.fx[${i}].done=this.value=='Yes';save()`)}</td><td><button onclick="S.fx.splice(${i},1);save();go('admin')">✕</button></td></tr>`).join('')}</table></div><h3>Add fixture</h3><select id="fo">${OPP.map(o=>`<option>${o[0]}</option>`).join('')}</select><input id="fd2" type="date"><input id="fk" type="time" value="15:00"><button onclick="addFx()">Add</button>`,
  cp:()=>`<h3>League table</h3><div class="tw"><table><tr><th>Club</th>${['P','W','D','L','GF','GA'].map(h=>`<th>${h}</th>`).join('')}</tr>${Object.entries(S.tab).map(([k,v])=>`<tr><td>${k=='ME'?S.club:k}</td>${['p','w','d','l','gf','ga'].map(x=>`<td>${I(v[x],`S.tab['${k}'].${x}=+this.value;save()`,50,1)}</td>`).join('')}</tr>`).join('')}</table></div><div>Cup round ${I(S.cup,'S.cup=+this.value;save()',50,1)} Eliminated ${SEL(['No','Yes'],S.cupOut?'Yes':'No',`S.cupOut=this.value=='Yes';save()`)}</div><h3>Custom tournaments</h3><input id="cn" placeholder="Name"><input id="ct" placeholder="Teams, comma separated" style="width:260px"><button onclick="mkCust()">Create</button>`+S.cust.map((c,ci)=>`<div class="card" style="margin-top:8px"><b>${c.name}</b> <button onclick="if(!requireLogin())return;S.cust.splice(${ci},1);save();go('admin')">Delete</button><div><select id="rh${ci}">${OPTS(c.teams)}</select> <input id="rx${ci}" type="number" style="width:50px"> - <input id="ry${ci}" type="number" style="width:50px"> <select id="ra${ci}">${OPTS(c.teams)}</select> <button onclick="addR(${ci})">Record result</button></div></div>`).join(''),
  tr:()=>S.tro.map((t,i)=>`<div>🏆 ${t.t} (Season ${t.s}) <button onclick="if(!requireLogin())return;S.tro.splice(${i},1);save();go('admin')">✕</button></div>`).join('')+`<input id="tn" placeholder="Trophy name"><input id="ts" type="number" placeholder="Season" style="width:80px"><button onclick="if(!requireLogin())return;if($('#tn').value){S.tro.push({t:$('#tn').value,s:+$('#ts').value||S.season});save();go('admin')}">Add trophy</button>`,
  ac:()=>`<div class="tw"><table><tr><th>Name</th><th>Age</th><th>Pos</th><th>OVR</th><th>Pot</th><th></th></tr>${S.acad.map((y,i)=>`<tr><td>${I(y.name,U('acad',i,'name'),130)}</td><td>${I(y.age,U('acad',i,'age',1),50,1)}</td><td>${SEL(['GK','DEF','MID','FWD'],y.pos,U('acad',i,'pos'))}</td><td>${I(y.ovr,U('acad',i,'ovr',1),50,1)}</td><td>${I(y.pot,U('acad',i,'pot',1),50,1)}</td><td><button onclick="if(!requireLogin())return;S.acad.splice(${i},1);save();go('admin')">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mu">No prospects.</td></tr>'}</table></div><button onclick="recruit()">Recruit prospect ($15,000)</button>`,
  nw:()=>`<input id="nn" placeholder="Headline" style="width:260px"><button onclick="if(!requireLogin())return;if($('#nn').value){news($('#nn').value);save();go('admin')}">Publish</button><button class="s" onclick="if(!requireLogin())return;S.news=[];save();go('admin')">Clear all</button>`+S.news.map((n,i)=>`<div>${n.d} — ${n.t} <button onclick="if(!requireLogin())return;S.news.splice(${i},1);save();go('admin')">✕</button></div>`).join(''),
  da:()=>`<div><input id="npw" type="password" autocomplete="new-password" placeholder="New admin password"><button onclick="chPw()">Change password</button></div><div style="margin-top:8px"><button onclick="newSeason()">Create next season</button><button onclick="if(!requireLogin())return;if(confirm('Reset ALL club data?')){S=def();initOpp();gen();save();go('dash')}">Reset club data</button><button class="s" onclick="exportD()">Export save</button><button class="s" onclick="importD()">Import save</button><button class="s" onclick="logout()">Logout</button></div>${renderSeasonHistory()}`
};
const HINT={ov:'Quick summary and shortcuts.',club:'Club name, manager, objective and popularity.',pl:'Edit any player directly in the table.',tm:'Recommended: 20 teams (19 opponents) for a full 38-match season.',st:'Edit staff names.',fi:'Set the balance or add income (+) and expenses (−).',sd:'Capacity, attendance and day/night lighting.',fx:'Edit dates, opponents and results.',cp:'Edit the league table, the cup, and create custom tournaments.',tr:'Add or remove trophies.',ac:'Edit or recruit academy prospects.',nw:'Publish or delete club news.',da:'Create the next season, back up or log out.'};
function admin0(){if(!adm)return`<h2>ADMIN LOGIN</h2><div class="card" style="max-width:420px"><div class="warn">Admin access only. You are viewing this site in read-only mode. Log in to make changes.</div><button onclick="showLogin()" class="ro-allow">🔑 Open Login</button></div>`;const TB=[['ov','📊 Overview'],['club','🏟 Club'],['pl','👥 Players'],['tm','🛡 Teams'],['st','👔 Staff'],['fi','💰 Finance'],['sd','🏟 Stadium'],['fx','📅 Fixtures'],['cp','🏆 Competitions'],['tr','🥇 Trophies'],['ac','🌱 Academy'],['nw','📰 News'],['da','🔒 Data & security']];return`<h2>ADMIN PANEL</h2><div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:10px">${TB.map(t=>`<button class="${at==t[0]?'':'s'}" onclick="at='${t[0]}';go('admin')">${t[1]}</button>`).join('')}</div><div class="mu" style="margin-bottom:8px">${HINT[at]}</div><div class="card tw">${AD[at]()}</div>`}
function admin(){return admin0()}
function exportD(){if(!requireLogin())return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='phoenix-fc-save.json';a.click()}
function importD(){if(!requireLogin())return;const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=Object.assign(def(),JSON.parse(r.result));initOpp();save();go('dash')}catch(e){alert('Invalid save file')}};r.readAsText(i.files[0])};i.click()}
function addFx(){if(!requireLogin())return;const d=$('#fd2').value;if(!d)return alert('Pick a date');S.fx.push({id:S.nid++,opp:$('#fo').value,home:true,comp:'League',date:new Date(d).toDateString(),ts:+new Date(d+'T'+$('#fk').value),ko:$('#fk').value,done:false,score:null});save();go('admin')}
function newSeason(){if(!requireLogin())return;if(OPP.length!==19){alert('Your league must contain 20 clubs: PHOENIX FC plus 19 opponents.');return}if(!confirm('Create Season '+(S.season+1)+'? The current season will be saved in Season History.'))return;if(!Array.isArray(S.seasonHistory))S.seasonHistory=[];const oldTable=JSON.parse(JSON.stringify(S.tab||{}));const oldFixtures=JSON.parse(JSON.stringify(S.fx||[]));S.seasonHistory.push({season:S.season,savedAt:new Date().toISOString(),table:oldTable,fixtures:oldFixtures,leagueComplete:!!S.lgDone,lastResult:S.last||null});S.season++;S.cup=0;S.cupOut=false;S.lgDone=0;S.last=null;S.players.forEach(p=>{p.age=(+p.age||0)+1;p.fit=100;p.inj=0});gen();if(!S.fx.length)return;news('Season '+S.season+' begins!');save();go('dash')}
const V={dash,squad,tac,match,fix,comp,stad,train,acad,staff,fin:finv,tro,news:newsv,dressing,kit,admin};
const PO={tac:drag};

// ── Boot ────────────────────────────────────────────────────────────────────
async function boot(){
  // 1. Seed state
  S = Object.assign(def(), JSON.parse(document.getElementById('seed').textContent||'{}'));
  initOpp();
  if(!S.fx || !S.fx.length) gen();

  // 2. Try to load latest cloud state (works for guests thanks to public_can_read RLS)
  let cloudOk=false;
  try{
    const cloud = await cloudLoad();
    if(cloud){
      S = Object.assign(def(), cloud);
      initOpp();
      cloudOk=true;
    }
    setConn('online','cloud ✓');
  }catch(e){
    console.warn('[boot] public load failed', e);
    setConn('error','offline');
  }
  // Only regenerate fixtures if cloud load succeeded but state is genuinely empty
  if(cloudOk && !S.fx?.length) gen();

  // 3. Realtime — runs for guests AND admins so everyone sees live updates
  subscribeRealtime();

  // 4. Restore admin session if a saved one exists
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      adm = true; RO = false; dbReady = true;
      document.body.classList.remove('ro');
    }
  }catch(e){}

  // 5. Auto-logout if the session expires mid-tab
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT' || (event === 'TOKEN_REFRESHED' && !session)){
      adm = false; RO = true; dbReady = false;
      document.body.classList.add('ro');
      ctl();
    }
  });

  // 6. UI boot
  nav(); tick();
  setInterval(tick, 1000);
  setInterval(()=>{ if(adm && !savePending) flushSave(); }, 30000);
  addEventListener('beforeunload', ()=>{ if(adm) flushSave(); });
  addEventListener('error', ()=>toast('Something went wrong — your progress is saved'));
  ctl();
  try{ const v = sessionStorage.getItem('pfcv'); go(V[v] ? v : 'dash'); } catch(e){ go('dash'); }
}
boot();
</script>
