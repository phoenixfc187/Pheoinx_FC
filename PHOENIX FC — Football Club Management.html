let S,$=s=>document.querySelector(s),cur='dash',M=null,T=null,edit=null,adm=false;

function go(v){cur=v;$$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));$('#main').innerHTML=V[v]();if(PO[v])PO[v]();hd()}

function stadium(){let ratio=S.stad.att?S.stad.att/S.stad.cap:.5,d='',cs=['#c8102e','#d4af37','#fff','#c8102e'];
const st=(x,y,w,h)=>{for(let i=x;i<x+w;i+=11)for(let j=y;j<y+h;j+=11)if(Math.random()<ratio)d+=`<circle cx="${i+5}" cy="${j+5}" r="3" fill="${ch(cs)}" ${Math.random()<.3?`class="cr" style="animation-delay:${Math.random()}s"`:''}/>`};
st(100,52,600,95);st(100,372,600,95);st(42,160,166,200);st(592,160,166,200);
let ads='';for(let i=0;i<6;i++)ads+=`<text x="${232+i*60}" y="158" font-size="7" fill="#d4af37">PHOENIX FC</text>`;
return`<svg viewBox="0 0 800 520" style="width:100%;border-radius:12px;background:var(--s1)"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s1)"/><stop offset="1" style="stop-color:var(--s2)"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#fffbd0" stop-opacity=".9"/><stop offset="1" stop-color="#fffbd0" stop-opacity="0"/></radialGradient></defs>
<rect class="sky" width="800" height="520"/><rect class="stn" x="100" y="48" width="600" height="102"/><rect class="stn" x="100" y="368" width="600" height="102"/><rect class="stn" x="40" y="156" width="170" height="208"/><rect class="stn" x="590" y="156" width="170" height="208"/>
<rect x="350" y="48" width="100" height="102" fill="#d4af3744"/><text x="400" y="62" fill="#d4af37" font-size="8" text-anchor="middle">VIP HOSPITALITY (2,000)</text>
${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${112+i*72}" y="48" width="56" height="9" fill="#000a" stroke="#d4af37" stroke-width=".5"/>`).join('')}
${d}<rect class="pit" x="210" y="160" width="380" height="200"/><rect x="210" y="160" width="380" height="200" fill="#000" opacity="var(--sh)" style="transform:scaleY(.25);transform-origin:bottom"/>
<g fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"><rect x="214" y="164" width="372" height="192"/><path d="M400 164v192"/><circle cx="400" cy="260" r="26"/><rect x="214" y="215" width="50" height="90"/><rect x="536" y="215" width="50" height="90"/></g>
<rect x="204" y="245" width="6" height="30" fill="none" stroke="#fff" stroke-dasharray="2"/><rect x="590" y="245" width="6" height="30" fill="none" stroke="#fff" stroke-dasharray="2"/>
${[[214,164],[586,164],[214,356],[586,356]].map(c=>`<path d="M${c[0]} ${c[1]}v-9" stroke="#c8102e" stroke-width="2"/>`).join('')}

function dash0(){const t=table(),i=t.findIndex(x=>x.k=='ME'),m=S.tab.ME,nx=S.fx.find(f=>!f.done);

async function adSave(){S.club=$('#a1').value||S.club;S.mgr=$('#a2').value;S.bal=+$('#a3').value;S.stad.cap=Math.max(1,+$('#a4').value);S.stad.vip=Math.min(S.stad.cap,+$('#a5').value);S.stad.att=Math.min(S.stad.cap,+$('#a6').value);S.pop=Math.max(0,Math.min(100,+$('#a7').value));S.obj=$('#a8').value;if($('#a9').value)S.pwh=await sha($('#a9').value);save();go('admin')}

function newSeason(){S.season++;S.cup=0;S.cupOut=false;S.lgDone=0;S.players.forEach(p=>{p.age++;p.fit=100});gen();news('Season '+S.season+' begins!');save();go('dash')}

function fxd(i){const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7)+7*i);d.setHours(15,0,0,0);return d}
async function sha(s){if(!(window.crypto&&crypto.subtle)){let h=5381;for(const c of 'pfc:'+s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pfc:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const v=$('#ap').value;if(!S.pwh){S.pwh=await sha('phoenix123')}if(await sha(v)===S.pwh){adm=true;go('admin')}else alert('Wrong password')}
function flash(t,c){const e=$('#live .mh');if(!e)return;const d=document.createElement('div');d.className='fl';d.textContent=t;d.style.color=c;e.appendChild(d);setTimeout(()=>d.remove(),2500)}
function spd(ms){if(!M||M.over)return;clearInterval(M.tm);M.spd=ms;M.tm=setInterval(step,ms)}
function pz(){if(!M||M.over)return;M.paused=!M.paused;$('#pz').textContent=M.paused?'▶ Resume':'⏸ Pause'}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,pwh:''})],{type:'application/json'}));a.download='phoenix-fc-save.json';a.click()}
function importD(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=Object.assign(def(),JSON.parse(r.result));delete S.pw;save();go('dash')}catch(e){alert('Invalid save file')}};r.readAsText(i.files[0])};i.click()}
function genSquad(){if(S.players.length&&!confirm('Add 18 more players to the existing squad?'))return;const f=['Marco','Luca','Diego','Kofi','Ravi','Jonas','Yuki','Ahmed','Tomas','Eli','Sam','Nico'],l=['Silva','Rossi','Khan','Mbeki','Novak','Sato','Ortiz','Reyes','Weber','Dubois','Patel','Costa'],n=['Brazil','Italy','India','Ghana','Spain','Japan','England','Egypt'],ps=['GK','GK','DEF','DEF','DEF','DEF','DEF','DEF','MID','MID','MID','MID','MID','MID','FWD','FWD','FWD','FWD'];ps.forEach((pos,i)=>S.players.push({id:S.nid++,name:ch(f)+' '+ch(l),num:(()=>{let k=i+1;while(S.players.some(p=>p.num==k))k++;return k})(),nat:ch(n),age:R(19,33),pos,ovr:R(62,80),fit:100,mor:70,form:6,xp:0,apps:0,goals:0,inj:0}));news('Starter squad registered');auto()}

function upd(c,i,k,v,n){S[c][i][k]=n?+v:v;save();toast('Saved ✓')}
function syncT(){S.teams=OPP.map(x=>[x[0],x[1]])}
function renT(i,v){v=v.trim();if(!v||OPP.some((o,j)=>j!=i&&o[0]==v))return alert('Team names must be unique');const old=OPP[i][0];OPP[i][0]=v;S.tab[v]=S.tab[old];delete S.tab[old];S.fx.forEach(f=>{if(f.opp==old)f.opp=v});syncT();save();toast('Team renamed ✓')}
function addT(){const n=$('#tnm').value.trim();if(!n||OPP.some(o=>o[0]==n))return alert('Enter a unique team name');if(!confirm('Adding a team rebuilds the fixtures and league table. Continue?'))return;OPP.push([n,+$('#tst').value||65]);syncT();gen();save();go('admin')}
function delT(i){if(OPP.length<4)return alert('Keep at least 4 opponents');if(!confirm('Remove this team? Fixtures and the league table will be rebuilt.'))return;OPP.splice(i,1);syncT();gen();save();go('admin')}
function addDef(){if(!confirm('Fill the league to 20 teams? Fixtures and table will be rebuilt.'))return;DEFT.forEach(t=>{if(OPP.length<19&&!OPP.some(o=>o[0]==t[0]))OPP.push([t[0],t[1]])});syncT();gen();save();go('admin')}
